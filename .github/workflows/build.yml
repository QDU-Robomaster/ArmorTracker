name: XRobot Module Build Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-webots:main
      options: --user 0

    env:
      XR_MODULE_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout current module repo to ./Modules/${{ env.XR_MODULE_NAME }}
        uses: actions/checkout@v4
        with:
          path: Modules/${{ env.XR_MODULE_NAME }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Create main.cpp
        run: |
          cat > main.cpp <<'EOF'
          #include "ArmorTracker.hpp"

          constexpr CameraTypes::FrameLayout kLayout{
              720, 540, 2160, CameraTypes::Encoding::BGR8};
          template class ArmorTracker<kLayout>;

          int main() { return 0; }
          EOF

      - name: Create minimal CMakeLists.txt
        run: |
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(xrobot_mod_test CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(XROBOT_MODULES_DIR ${CMAKE_CURRENT_SOURCE_DIR}/Modules/)
          set(WEBOTS_HOME /usr/local/webots)
          set(LIBXR_PRINT_INTEGER_ENABLE_64BIT ON CACHE BOOL "" FORCE)
          set(LIBXR_PRINT_FLOAT_ENABLE_DOUBLE ON CACHE BOOL "" FORCE)
          set(LIBXR_PRINT_ENABLE_POINTER ON CACHE BOOL "" FORCE)
          add_subdirectory(libxr)
          set_property(TARGET xr PROPERTY CXX_STANDARD 20)
          set_property(TARGET xr PROPERTY CXX_STANDARD_REQUIRED ON)
          add_executable(armor_tracker_compile_test main.cpp)
          target_link_libraries(armor_tracker_compile_test PRIVATE xr)
          EOF

      - name: Pull libxr to ./libxr
        run: git clone --depth=1 --branch master https://github.com/Jiu-xiao/libxr ./libxr

      - name: Setup Python and build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgpiod-dev
          python3 -m pip install --upgrade pip
          pip3 install pyyaml requests

      - name: Add XRobot tools to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install xrobot toolchain
        run: pip3 install xrobot libxr

      - name: Prepare module sources
        run: |
          xrobot_setup || true
          xrobot_src_man add-source https://qdu-robomaster.github.io/qdu-future-modules/index.yaml
          xrobot_add_mod qdu-future/${{ env.XR_MODULE_NAME }}
          cat Modules/sources.yaml
          cat Modules/modules.yaml

      - name: Add current manifest dependencies to module config
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          import yaml
          from xrobot.ModuleParser import load_single_module

          module_path = Path("Modules") / os.environ["XR_MODULE_NAME"]
          manifest = load_single_module(module_path)
          if manifest is None:
              raise SystemExit(f"manifest not found: {module_path}")

          config_path = Path("Modules/modules.yaml")
          config = yaml.safe_load(config_path.read_text(encoding="utf-8")) or {}
          config["modules"] = list(manifest.depends)
          config_path.write_text(
              yaml.safe_dump(config, sort_keys=False, allow_unicode=True),
              encoding="utf-8",
          )
          print("direct manifest dependencies:", manifest.depends)
          PY

      - name: Sync module repos from MANIFEST dependencies
        run: xrobot_init_mod

      - name: Align coordinated dependency branches
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for module_dir in Modules/*; do
            [[ -d "${module_dir}" ]] || continue
            [[ "$(basename "${module_dir}")" == "${XR_MODULE_NAME}" ]] && continue
            git -C "${module_dir}" rev-parse --git-dir >/dev/null 2>&1 || continue
            if git -C "${module_dir}" ls-remote --exit-code --heads origin "refs/heads/${candidate}" >/dev/null 2>&1; then
              git -C "${module_dir}" fetch --depth=1 origin "refs/heads/${candidate}"
              git -C "${module_dir}" checkout --detach FETCH_HEAD
              git -C "${module_dir}" submodule update --init --recursive --depth=1
            fi
          done

      - name: Build
        run: |
          cmake -S . -B build \
            -DOpenVINO_DIR=/opt/intel/openvino_2025.4.0/runtime/cmake \
            -DBUILD_TESTING=ON \
            -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON \
            -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON \
            -DLIBXR_PRINT_ENABLE_POINTER=ON
          cmake --build build -j2 --target \
            armor_tracker_compile_test \
            armor_tracker_frame_geometry_test \
            armor_tracker_distortion_projection_test \
            armor_tracker_queue_contract_test \
            armor_tracker_stage_frame_contract_test

      - name: Run ArmorTracker tests
        run: >-
          ctest --test-dir build/libxr --output-on-failure
          --no-tests=error
          -R '^armor_tracker_' --timeout 15

      - name: Run coordinate semantics check
        run: |
          g++ -std=c++20 -O2 \
            -IModules/${{ env.XR_MODULE_NAME }} \
            -I/usr/include/eigen3 \
            $(pkg-config --cflags --libs opencv4) \
            Modules/${{ env.XR_MODULE_NAME }}/tools/coordinate_semantics_check.cpp \
            -o build/coordinate_semantics_check
          ./build/coordinate_semantics_check

      - name: Create Tag via GitHub API
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagPrefix = 'auto-'
            const date = new Date();
            const yyyy = date.getUTCFullYear();
            const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(date.getUTCDate()).padStart(2, '0');
            const HH = String(date.getUTCHours()).padStart(2, '0');
            const MM = String(date.getUTCMinutes()).padStart(2, '0');
            const SS = String(date.getUTCSeconds()).padStart(2, '0');
            const tagName = `${tagPrefix}${yyyy}${mm}${dd}-${HH}${MM}${SS}`;
            const sha = process.env.GITHUB_SHA;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: sha
            });
            console.log(`Created tag: ${tagName} on sha: ${sha}`);
